<!doctype html>
<html>

<head>
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <title>GoiMon Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="_content/BlazorBlueprint.Components/blazorblueprint.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>
    <button id="pwa-install-btn" hidden
        style="position: fixed; right: 16px; bottom: 16px; z-index: 9999; border: 0; border-radius: 10px; padding: 10px 14px; background: #16a34a; color: white; font-weight: 600; cursor: pointer;">
        Cài app
    </button>

    <!-- Google OAuth SDK -->
    <script async defer crossorigin="anonymous"
        src="https://apis.google.com/js/platform.js?onload=onGoogleLoad&appid=[GOOGLE_CLIENT_ID]"></script>

    <!-- Facebook SDK -->
    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '[FACEBOOK_APP_ID]',
                xfbml: true,
                version: 'v20.0'
            });
        };
    </script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

    <script src="js/orders-scroll.js"></script>
    <script src="js/theme-settings.js"></script>
    <script>
        window.goiMonTheme?.initialize();
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        function safeBlazorStart() {
            if (window.__goiMonBlazorStarted) return;
            window.__goiMonBlazorStarted = true;
            Blazor.start().catch(err => {
                window.__goiMonBlazorStarted = false;
                console.error('[Blazor start failed]', err);
            });
        }

        window.bitBswupHandler = function (type, data) {
            if (window.BswupMessage && type === BswupMessage.updateReady) {
                console.log("[Bswup] update ready");
            }
        };

        let deferredInstallPrompt = null;
        const installBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installBtn.hidden = false;
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;

            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            installBtn.hidden = true;
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            installBtn.hidden = true;
        });

        (function bootstrapPwa() {
            const script = document.createElement('script');
            script.src = '_content/Bit.Bswup/bit-bswup.js';
            script.setAttribute('scope', '/');
            script.setAttribute('log', 'verbose');
            script.setAttribute('sw', 'service-worker.js');
            script.setAttribute('handler', 'bitBswupHandler');
            script.setAttribute('blazorScript', '_framework/blazor.webassembly.js');
            script.onerror = () => safeBlazorStart();
            setTimeout(() => {
                safeBlazorStart();
            }, 5000);
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>
