query GetProducts($skip: Int, $take: Int, $where: ProductFilterInput, $order: [ProductSortInput!]) {
  products(skip: $skip, take: $take, where: $where, order: $order) {
    items {
      id
      name
      price
      description
      categoryId
      category {
        id
        name
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}
