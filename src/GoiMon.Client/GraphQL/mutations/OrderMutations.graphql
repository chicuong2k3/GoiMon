mutation CreateOrder($input: CreateOrderInput!) {
  createOrder(input: $input) {
    order {
      id
      status
      total
      createdAt
      items {
        id
        productName
        unitName
        comboId
        comboName
        qty
        unitPrice
        modifiers {
          id
          groupName
          optionName
          qty
          unitDeltaPrice
        }
      }
    }
    errors {
      code
      message
      lineIndex
    }
  }
}

mutation CompleteOrder($orderId: UUID!) {
  completeOrder(orderId: $orderId) {
    id
    status
    total
  }
}

mutation CancelOrder($orderId: UUID!) {
  cancelOrder(orderId: $orderId) {
    id
    status
    total
  }
}

mutation MarkOrderPaid($orderId: UUID!) {
  markOrderPaid(orderId: $orderId) {
    id
    status
    total
  }
}
