mutation CreateEmployee($email: String!, $phone: String, $firstName: String, $lastName: String, $role: UserRole!) {
  createEmployee(input: { email: $email, phone: $phone, firstName: $firstName, lastName: $lastName, role: $role }) {
    id
    email
    phone
    firstName
    lastName
    role
    isActive
    isVerified
    createdAt
    updatedAt
  }
}

mutation UpdateEmployee($id: UUID!, $email: String!, $phone: String, $firstName: String, $lastName: String, $role: UserRole!) {
  updateEmployee(input: { id: $id, email: $email, phone: $phone, firstName: $firstName, lastName: $lastName, role: $role }) {
    id
    email
    phone
    firstName
    lastName
    role
    isActive
    isVerified
    createdAt
    updatedAt
  }
}

mutation ToggleEmployeeStatus($id: UUID!, $isActive: Boolean!) {
  toggleEmployeeStatus(input: { id: $id, isActive: $isActive }) {
    id
    email
    role
    isActive
    updatedAt
  }
}
