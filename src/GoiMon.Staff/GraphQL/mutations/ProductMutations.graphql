mutation CreateProduct($name: String!, $price: Decimal!, $categoryId: UUID, $description: String, $imageUrl: String, $unitName: String) {
  createProduct(input: { name: $name, price: $price, categoryId: $categoryId, description: $description, imageUrl: $imageUrl, unitName: $unitName }) {
    id
    name
    price
    unitName
    description
    categoryId
    imageUrl
  }
}

mutation UpdateProduct($id: UUID!, $name: String!, $price: Decimal!, $categoryId: UUID, $description: String, $imageUrl: String, $unitName: String) {
  updateProduct(input: { id: $id, name: $name, price: $price, categoryId: $categoryId, description: $description, imageUrl: $imageUrl, unitName: $unitName }) {
    id
    name
    price
    unitName
    description
    categoryId
    imageUrl
  }
}

mutation DeleteProduct($id: UUID!) {
  deleteProduct(id: $id)
}

mutation CreateProductVariant($productId: UUID!, $input: ProductVariantInput!) {
  createProductVariant(productId: $productId, input: $input) {
    id
    productId
    code
    name
    price
    sortOrder
    isActive
  }
}

mutation UpdateProductVariant($id: UUID!, $input: ProductVariantInput!) {
  updateProductVariant(id: $id, input: $input) {
    id
    productId
    code
    name
    price
    sortOrder
    isActive
  }
}

mutation DeleteProductVariant($id: UUID!) {
  deleteProductVariant(id: $id)
}

