query GetOrders($first: Int, $after: String, $where: OrderFilterInput) {
  orders(
    first: $first
    after: $after
    where: $where
    order: [{ createdAt: DESC }]
  ) {
    nodes {
      id
      tableSlotId
      status
      total
      createdAt
      items {
        id
        productName
        unitName
        comboId
        comboName
        qty
        unitPrice
        modifiers {
          id
          groupName
          optionName
          qty
          unitDeltaPrice
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetOrderById($id: UUID!) {
  orderById(id: $id) {
    id
    tableSlotId
    status
    total
    createdAt
    items {
      id
      productName
      unitName
      comboId
      comboName
      qty
      unitPrice
      modifiers {
        id
        groupName
        optionName
        qty
        unitDeltaPrice
      }
    }
  }
}
