query GetCategories($skip: Int, $take: Int, $where: CategoryFilterInput, $order: [CategorySortInput!]) {
  categoriesOffset(skip: $skip, take: $take, where: $where, order: $order) {
    items {
      id
      name
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}
