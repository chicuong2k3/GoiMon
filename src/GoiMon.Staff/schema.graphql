schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  products(skip: Int take: Int where: ProductFilterInput order: [ProductSortInput!]): ProductsCollectionSegment
  productsByCategoryName(skip: Int take: Int categoryName: String! where: ProductFilterInput order: [ProductSortInput!]): ProductsByCategoryNameCollectionSegment
  productById(id: UUID!): Product
  orders("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: OrderFilterInput order: [OrderSortInput!]): OrdersConnection
  orderById(id: UUID!): Order
  categories("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: CategoryFilterInput order: [CategorySortInput!]): CategoriesConnection
  categoriesOffset(skip: Int take: Int where: CategoryFilterInput order: [CategorySortInput!]): CategoriesOffsetCollectionSegment
  categoryById(id: UUID!): Category
  combos(skip: Int take: Int where: ProductComboFilterInput order: [ProductComboSortInput!]): CombosCollectionSegment
  comboById(id: UUID!): ProductCombo
  employees(skip: Int take: Int where: UserFilterInput order: [UserSortInput!]): EmployeesCollectionSegment
  tableSlots(skip: Int take: Int where: TableSlotFilterInput order: [TableSlotSortInput!]): TableSlotsCollectionSegment
}

type Mutation {
  createProduct(input: ProductInput! image: Upload): Product!
  createProducts(inputs: [ProductInput!]!): [Product!]!
  updateProduct(input: UpdateProductInput! image: Upload): Product
  deleteProduct(id: UUID!): Boolean!
  createProductVariant(productId: UUID! input: ProductVariantInput!): ProductVariant!
  updateProductVariant(id: UUID! input: ProductVariantInput!): ProductVariant
  deleteProductVariant(id: UUID!): Boolean!
  createModifierGroup(productId: UUID! input: ModifierGroupInput!): ModifierGroup!
  updateModifierGroup(id: UUID! input: ModifierGroupInput!): ModifierGroup
  deleteModifierGroup(id: UUID!): Boolean!
  createModifierOption(groupId: UUID! input: ModifierOptionInput!): ModifierOption!
  updateModifierOption(id: UUID! input: ModifierOptionInput!): ModifierOption
  deleteModifierOption(id: UUID!): Boolean!
  createOrder(input: CreateOrderInput!): CreateOrderPayload!
  completeOrder(orderId: UUID!): Order
  markOrderPaid(orderId: UUID!): Order
  cancelOrder(orderId: UUID!): Order
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(input: UpdateCategoryInput!): Category
  deleteCategory(id: UUID!): Boolean!
  createCombo(input: CreateComboInput! image: Upload): ProductCombo!
  updateCombo(input: UpdateComboInput! image: Upload): ProductCombo
  deleteCombo(id: UUID!): Boolean!
  addComboItem(input: AddComboItemInput!): ProductCombo
  updateComboItem(input: UpdateComboItemInput!): ProductCombo
  removeComboItem(input: RemoveComboItemInput!): ProductCombo
  createEmployee(input: CreateEmployeeInput!): User!
  updateEmployee(input: UpdateEmployeeInput!): User
  toggleEmployeeStatus(input: ToggleEmployeeStatusInput!): User
  createTableSlot(input: CreateTableSlotInput!): TableSlot!
  updateTableSlot(input: UpdateTableSlotInput!): TableSlot
  deactivateTableSlot(input: DeactivateTableSlotInput!): TableSlot
  setTableState(input: SetTableStateInput!): TableSlot
  mergeTableSlots(input: MergeTableSlotsInput!): Order
  splitTableSlot(input: SplitTableSlotInput!): TableSlot
  splitBill(input: SplitBillInput!): Order
  registerWithGoogle(input: RegisterWithOAuthInput!): AuthenticationPayload
  registerWithFacebook(input: RegisterWithOAuthInput!): AuthenticationPayload
  loginWithGoogle(input: LoginWithOAuthInput!): AuthenticationPayload
  loginWithFacebook(input: LoginWithOAuthInput!): AuthenticationPayload
  verifyOtp(input: VerifyOtpInput!): OtpVerificationPayload
}

type Subscription {
  onOrderChanged: Order!
  onTableSlotChanged: TableSlot!
}

