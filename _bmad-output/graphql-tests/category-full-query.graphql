# Categories with filtering, sorting and cursor paging
query ListCategoriesFull($first: Int, $after: String, $where: CategoryFilterInput, $order: [CategorySortInput!])
{
  categories(first: $first, after: $after, where: $where, order: $order) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
      }
    }
    nodes {
      id
      name
    }
  }
}

# Notes:
# - Variable types (`CategoryFilter`, `CategorySort`) are generated by HotChocolate when
#   `UseFiltering()` and `UseSorting()` are enabled. Adjust names if your schema differs.