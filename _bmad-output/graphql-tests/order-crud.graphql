# ─────────────────────────────────────────────────────────────────────────────
# Orders Feature — Full CRUD GraphQL Test Operations
# Endpoint: http://localhost:5100/graphql
#
# Model notes:
#   - OrderItem stores an immutable snapshot (productName, unitName, unitPrice)
#     at order-time. productId is a soft BI reference only (nullable).
#   - Status lifecycle: Open → Completed → Paid | Open → Cancelled
#
# Implementation status:
#   ✅ createOrder          — active
#   🔲 addOrderItem         — planned (Phase 1)
#   🔲 updateOrderItem      — planned (Phase 1)
#   🔲 removeOrderItem      — planned (Phase 1)
#   🔲 completeOrder        — planned (Phase 1)
#   🔲 cancelOrder          — planned (Phase 1)
#   🔲 markOrderPaid        — planned (Phase 2)
#   🔲 orders (query)       — planned (Phase 1)
#   🔲 orderById (query)    — planned (Phase 1)
#   🔲 ordersByStatus       — planned (Phase 2)
# ─────────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════════
# QUERIES
# ════════════════════════════════════════════════════════════════════════════

# Q-01: List all orders — offset paging + filter by status + sort by id desc
# 🔲 Requires OrderQueries to be activated
query ListOrders($skip: Int, $take: Int, $status: OrderStatus) {
  orders(
    skip: $skip
    take: $take
    where: { status: { eq: $status } }
    order: { id: DESC }
  ) {
    items {
      id
      status
      total
      items {
        id
        productId
        productName
        unitName
        qty
        unitPrice
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}

# Q-02: Get single order by id
# 🔲 Requires OrderQueries to be activated
query GetOrderById($id: UUID!) {
  orderById(id: $id) {
    id
    status
    total
    items {
      id
      productId
      productName
      unitName
      qty
      unitPrice
    }
  }
}

# Q-03: List orders filtered by status (kitchen/cashier board)
# 🔲 Requires OrderQueries to be activated
query GetOrdersByStatus($status: OrderStatus!) {
  orders(where: { status: { eq: $status } }) {
    items {
      id
      status
      total
      items {
        productName
        unitName
        qty
        unitPrice
      }
    }
    totalCount
  }
}

