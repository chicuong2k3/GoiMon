# ════════════════════════════════════════════════════════════════════════════
# VALIDATION / ERROR CASES
# ════════════════════════════════════════════════════════════════════════════

# ERR-01: Empty items list → "Order must contain at least one item"
mutation CreateOrder_EmptyItems($input: OrderInput!) {
  createOrder(input: $input) {
    id
  }
}

# ERR-02: Missing productName → "Product name snapshot is required"
mutation CreateOrder_NoProductName($input: OrderInput!) {
  createOrder(input: $input) {
    id
  }
}

# ERR-03: Qty = 0 → qty must be > 0
mutation CreateOrder_ZeroQty($input: OrderInput!) {
  createOrder(input: $input) {
    id
  }
}

# ERR-04: Negative unitPrice → unitPrice must be >= 0
mutation CreateOrder_NegativePrice($input: OrderInput!) {
  createOrder(input: $input) {
    id
  }
}

# ERR-05: productName exceeds 255 chars
mutation CreateOrder_LongName($input: OrderInput!) {
  createOrder(input: $input) {
    id
  }
}

# ERR-06: unitName exceeds 50 chars
mutation CreateOrder_LongUnitName($input: OrderInput!) {
  createOrder(input: $input) {
    id
  }
}