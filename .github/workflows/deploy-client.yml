name: Deploy GoiMon Client

on:
    push:
        branches: ["main"]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Filter changed paths
              id: filter
              uses: dorny/paths-filter@v2
              with:
                  filters: |
                      publish_client:
                        - 'src/GoiMon.Staff/**'
                      nginx_only:
                        - 'nginx/**'

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              if: steps.filter.outputs.publish_client == 'true'
              run: dotnet restore src/GoiMon.Staff/GoiMon.Staff.csproj

            - name: Publish
              if: steps.filter.outputs.publish_client == 'true'
              run: dotnet publish src/GoiMon.Staff/GoiMon.Staff.csproj -c Release -o publish

            - name: Prepare deploy directory
              if: steps.filter.outputs.publish_client == 'true'
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      sudo mkdir -p /var/www/goimon-client
                      sudo chown $USER:$USER /var/www/goimon-client

            - name: Deploy via SCP
              if: steps.filter.outputs.publish_client == 'true'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: "publish/wwwroot/*"
                  target: "/var/www/goimon-client"
                  strip_components: 2

            - name: Deploy nginx config
              if: steps.filter.outputs.nginx_only == 'true' || steps.filter.outputs.publish_client == 'true'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: "nginx/goimon.conf"
                  target: "/tmp/goimon-nginx"
                  strip_components: 1

            - name: Reload web server
              if: steps.filter.outputs.nginx_only == 'true' || steps.filter.outputs.publish_client == 'true'
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      sudo cp /tmp/goimon-nginx/goimon.conf /etc/nginx/sites-available/goimon
                      sudo ln -sf /etc/nginx/sites-available/goimon /etc/nginx/sites-enabled/goimon
                      sudo nginx -t
                      sudo systemctl reload nginx
