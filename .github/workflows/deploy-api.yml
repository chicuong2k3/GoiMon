name: Deploy GoiMon API

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch: {}

jobs:
  deploy-dev:
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            goimon_api:
              - 'src/GoiMon.Api/**'
              - 'tests/GoiMon.Api.Tests/**'
              - 'src/Shared/**'
              - 'src/**/*.cs'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet restore GoiMon.sln

      - name: Build
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet build GoiMon.sln -c Release --no-restore

      - name: Test
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet test tests/GoiMon.Api.Tests/GoiMon.Api.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet publish src/GoiMon.Api/GoiMon.Api.csproj -c Release -o publish

      - name: Prepare deploy directory (dev server)
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          script: |
            sudo mkdir -p /var/www/goimon-api-dev
            sudo chown $USER:$USER /var/www/goimon-api-dev

      - name: Deploy via SCP to dev
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          source: "publish/*"
          target: "/var/www/goimon-api-dev"
          strip_components: 1

  deploy-prod:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            goimon_api:
              - 'src/GoiMon.Api/**'
              - 'tests/GoiMon.Api.Tests/**'
              - 'src/Shared/**'
              - 'src/**/*.cs'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet restore GoiMon.sln

      - name: Build
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet build GoiMon.sln -c Release --no-restore

      - name: Test
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet test tests/GoiMon.Api.Tests/GoiMon.Api.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: dotnet publish src/GoiMon.Api/GoiMon.Api.csproj -c Release -o publish

      - name: Upload artifact (optional)
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: goimon-api-publish
          path: publish

      - name: Prepare deploy directory (prod)
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/goimon-api
            sudo chown $USER:$USER /var/www/goimon-api

      - name: Deploy via SCP to prod
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "publish/*"
          target: "/var/www/goimon-api"
          strip_components: 1

      - name: Set production env vars (only secrets)
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        run: |
          echo "Production secrets should be set in the target host or via your platform's secret manager."
