name: Deploy GoiMon API

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GoiMon.sln

      - name: Build
        run: dotnet build GoiMon.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/GoiMon.Api.Tests/GoiMon.Api.Tests.csproj -c Release --no-build --verbosity normal

  deploy-dev:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: test
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            goimon_api:
              - 'src/GoiMon.Api/**'
              - 'tests/GoiMon.Api.Tests/**'
              - 'src/Shared/**'
              - 'docker-compose.yml'

      - name: Deploy source to server
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          source: "src/GoiMon.Api/,docker-compose.yml,.dockerignore"
          target: "/var/www/goimon"

      - name: Docker Compose up (dev)
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          script: |
            cd /var/www/goimon
            docker compose up -d --build api

  deploy-prod:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            goimon_api:
              - 'src/GoiMon.Api/**'
              - 'tests/GoiMon.Api.Tests/**'
              - 'src/Shared/**'
              - 'docker-compose.yml'

      - name: Deploy source to server
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/GoiMon.Api/,docker-compose.yml,.dockerignore"
          target: "/var/www/goimon"

      - name: Docker Compose up (prod)
        if: ${{ steps.filter.outputs.goimon_api == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/goimon
            docker compose up -d --build api
